name: Daily Job Search

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  scan-jobs:
    name: Scan Job Boards & Send Digest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install playwright python-dotenv requests beautifulsoup4 lxml httpx jinja2 nltk python-Levenshtein tabulate openpyxl
          playwright install chromium
          playwright install-deps

      - name: Create .env from secrets
        run: |
          echo "LINKEDIN_EMAIL=${{ secrets.LINKEDIN_EMAIL }}" >> .env
          echo "LINKEDIN_PASSWORD=${{ secrets.LINKEDIN_PASSWORD }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "EMAIL=${{ secrets.EMAIL }}" >> .env
          echo "PHONE=${{ secrets.PHONE }}" >> .env
          echo "LINKEDIN_URL=${{ secrets.LINKEDIN_URL }}" >> .env
          echo "MIN_SALARY=50000" >> .env

      - name: Create logs directory
        run: mkdir -p logs

      - name: Scan non-LinkedIn job boards
        run: python3 other_boards_monitor.py once

      - name: Generate ATS report
        run: python3 ats_optimizer.py || true

      - name: Generate application tracker
        run: python3 tracker.py || true

      - name: Generate daily digest email
        run: python3 daily_digest.py || true

      - name: Commit new job data
        run: |
          git config user.name "Job Bot"
          git config user.email "bot@automation.local"
          git add logs/
          git diff --cached --quiet || git commit -m "Auto: update job data"
          git push

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-data
          path: |
            logs/entry_level_jobs.json
            logs/other_jobs.json
            logs/linkedin_applied.json
          retention-days: 14
